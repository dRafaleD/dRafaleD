<svg xmlns="http://www.w3.org/2000/svg" width="920" height="190" viewBox="0 0 920 190" role="img" aria-label="Black Mesa terminal outro">
  <defs>
    <linearGradient id="outro-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d12"/>
      <stop offset="1" stop-color="#010409"/>
    </linearGradient>
    <linearGradient id="outro-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9900"/>
      <stop offset=".5" stop-color="#00ff41"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <clipPath id="outro-body">
      <rect x="14" y="37" width="892" height="139"/>
    </clipPath>
    <style>
      text{font-family:'Cascadia Code','Fira Code',Consolas,Menlo,Monaco,'Courier New',monospace}
      .dim{fill:#768390}.value{fill:#d0d7de}.prompt{fill:#58a6ff}.ok{fill:#00e676;font-weight:700}.warn{fill:#ffb000;font-weight:700}
    </style>
  </defs>
  <rect width="920" height="190" rx="15" fill="url(#outro-bg)" stroke="#30363d" stroke-width="1.5"/>
  <path d="M15 0h890a15 15 0 0 1 15 15v22H0V15A15 15 0 0 1 15 0z" fill="#161b22"/>
  <circle cx="25" cy="18.5" r="6.5" fill="#ff5f57"/>
  <circle cx="47" cy="18.5" r="6.5" fill="#febc2e"/>
  <circle cx="69" cy="18.5" r="6.5" fill="#28c840"/>
  <text x="460" y="24" font-size="13" class="dim" text-anchor="middle">dRafaleD@black-mesa: ~/session-outro</text>
  <path d="M0 37h920" stroke="#30363d"/>
  <g clip-path="url(#outro-body)">
    <path d="M34 58h852" stroke="url(#outro-line)" stroke-width="2" opacity=".85">
      <animate attributeName="opacity" values=".35;.9;.35" dur="3.2s" repeatCount="indefinite"/>
    </path>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;.08;1" dur="8s" repeatCount="indefinite"/>
      <text x="36" y="88" font-size="15.5" class="prompt">$</text>
      <text x="56" y="88" font-size="15.5" class="value">session --close --signal quiet</text>
      <rect x="309" y="73" width="8" height="16" fill="#00e676">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.45;.46;.9;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.13;.18;1" dur="8s" repeatCount="indefinite"/>
      <text x="36" y="119" font-size="14.5" class="warn">quote</text>
      <text x="98" y="119" font-size="14.5" class="dim">:</text>
      <text x="122" y="119" font-size="14.5" class="value">The quieter you become, the more you are able to hear.</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.22;.27;1" dur="8s" repeatCount="indefinite"/>
      <text x="36" y="151" font-size="14.5" class="ok">status</text>
      <text x="105" y="151" font-size="14.5" class="dim">:</text>
      <text x="129" y="151" font-size="14.5" class="value">sector clear</text>
      <text x="285" y="151" font-size="14.5" class="ok">access</text>
      <text x="354" y="151" font-size="14.5" class="dim">:</text>
      <text x="378" y="151" font-size="14.5" class="value">granted</text>
      <text x="510" y="151" font-size="14.5" class="ok">protocol</text>
      <text x="598" y="151" font-size="14.5" class="dim">:</text>
      <text x="622" y="151" font-size="14.5" class="value">black mesa active</text>
    </g>
  </g>
</svg>
