<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="704" viewBox="0 0 1000 704" role="img" aria-labelledby="t d">
<title id="t">The research atlas — from signal to evidence</title><desc id="d">Banshee: offline analysis. AsphDex: static malware triage. FhniX: email security. The-Trackher: digital-footprint research. Connected by local, explainable analysis.</desc>
<defs>
 <radialGradient id="halo"><stop stop-color="#39ff88" stop-opacity=".12"/><stop offset="1" stop-color="#39ff88" stop-opacity="0"/></radialGradient>
 <linearGradient id="fade"><stop stop-color="#39ff88" stop-opacity=".55"/><stop offset="1" stop-color="#39ff88" stop-opacity="0"/></linearGradient>
 <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<style>
text{font-family:'Segoe UI',Ubuntu,Arial,sans-serif}
.mono{font-family:Consolas,'DejaVu Sans Mono',monospace;letter-spacing:1.8px}
.flow{stroke-dasharray:3 22;animation:flow 9s linear infinite}
.orbit{animation:orbit 60s linear infinite;transform-origin:500px 370px}
.pulse{animation:pulse 5s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-250}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.flow,.orbit,.pulse{animation:none}}
</style>
<rect width="1000" height="704" rx="20" fill="#070b09"/>
<text x="40" y="45" font-size="13" fill="#39ff88" class="mono">THE RESEARCH ATLAS</text><text x="40" y="99" font-size="43" fill="#e7ffef" font-weight="600">From signal to evidence.</text><text x="40" y="132" font-size="18" fill="#a5b9ac" >Four projects. One way of thinking: inspect, explain, preserve.</text><ellipse cx="500" cy="370" rx="235" ry="220" fill="url(#halo)"/><path d="M370 251C440 251 405 370 500 370" fill="none" stroke="#1c422b" stroke-width="1.5"/><path class="flow" style="animation-delay:-0s" d="M370 251C440 251 405 370 500 370" fill="none" stroke="#39ff88" stroke-width="2"/><path d="M630 251C560 251 595 370 500 370" fill="none" stroke="#1c422b" stroke-width="1.5"/><path class="flow" style="animation-delay:-2s" d="M630 251C560 251 595 370 500 370" fill="none" stroke="#39ff88" stroke-width="2"/><path d="M370 509C440 509 405 370 500 370" fill="none" stroke="#1c422b" stroke-width="1.5"/><path class="flow" style="animation-delay:-4s" d="M370 509C440 509 405 370 500 370" fill="none" stroke="#39ff88" stroke-width="2"/><path d="M630 509C560 509 595 370 500 370" fill="none" stroke="#1c422b" stroke-width="1.5"/><path class="flow" style="animation-delay:-6s" d="M630 509C560 509 595 370 500 370" fill="none" stroke="#39ff88" stroke-width="2"/><circle cx="500" cy="370" r="104" fill="none" stroke="#173c25"/><g class="orbit"><circle cx="500" cy="370" r="91" fill="none" stroke="#39ff88" stroke-opacity=".5" stroke-dasharray="38 175 8 175"/><circle cx="500" cy="279" r="4" fill="#b7f34a"/></g><path d="m500 312 58 58-58 58-58-58Z" fill="#0b1b10" stroke="#39ff88" stroke-opacity=".8"/><path d="m500 325 45 45-45 45-45-45Z" fill="none" stroke="#1b512c"/><text x="500" y="368" font-size="15" fill="#e0ffeb" text-anchor="middle" class="mono">EVIDENCE</text><text x="500" y="390" font-size="10" fill="#75a386" text-anchor="middle" class="mono">LOCAL FIRST</text><path d="M40 199v-16h28 M370 183h-28 M40 340v16h28 M370 340v16h-28" fill="none" stroke="#285b38"/><text x="57" y="205" font-size="11" fill="#7fa38a" class="mono">01 / OFFLINE ANALYSIS</text><text x="57" y="248" font-size="32" fill="#e6ffed" font-weight="600">Banshee</text><g transform="translate(315 220)" fill="none" stroke="#39ff88" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"> <path d="M7 3h19l9 9v31H7Z M26 3v10h9 M14 23h14 M14 30h14"/></g><text x="57" y="282" font-size="16" fill="#a5b9ac" >Decode values. Inspect files.</text><text x="57" y="307" font-size="16" fill="#a5b9ac" >Extract IOCs. Preserve evidence.</text><text x="57" y="337" font-size="10" fill="#b7f34a" class="mono">RUST / YARA / ALPHA</text><path d="M630 199v-16h28 M960 183h-28 M630 340v16h28 M960 340v16h-28" fill="none" stroke="#285b38"/><text x="647" y="205" font-size="11" fill="#7fa38a" class="mono">02 / STATIC MALWARE TRIAGE</text><text x="647" y="248" font-size="32" fill="#e6ffed" font-weight="600">AsphDex</text><g transform="translate(905 220)" fill="none" stroke="#39ff88" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"> <path d="m22 2 17 7v13c0 12-17 23-17 23S5 34 5 22V9Z M13 23l7 7 12-16"/></g><text x="647" y="282" font-size="16" fill="#a5b9ac" >PE/ELF inspection. YARA matches.</text><text x="647" y="307" font-size="16" fill="#a5b9ac" >Explain findings without execution.</text><text x="647" y="337" font-size="10" fill="#b7f34a" class="mono">ELECTRON / JS / RUST / YARA</text><path d="M40 457v-16h28 M370 441h-28 M40 598v16h28 M370 598v16h-28" fill="none" stroke="#285b38"/><text x="57" y="463" font-size="11" fill="#7fa38a" class="mono">03 / EMAIL SECURITY</text><text x="57" y="506" font-size="32" fill="#e6ffed" font-weight="600">FhniX</text><g transform="translate(315 478)" fill="none" stroke="#39ff88" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"> <path d="M3 10h39v29H3Z m1 2 19 14 18-14 M4 38l13-14 M41 38 28 24"/></g><text x="57" y="540" font-size="16" fill="#a5b9ac" >Explainable phishing email triage.</text><text x="57" y="565" font-size="16" fill="#a5b9ac" >Local scoring. Read-only IMAP.</text><text x="57" y="595" font-size="10" fill="#b7f34a" class="mono">PYTHON / DESKTOP &amp; CLI</text><path d="M630 457v-16h28 M960 441h-28 M630 598v16h28 M960 598v16h-28" fill="none" stroke="#285b38"/><text x="647" y="463" font-size="11" fill="#7fa38a" class="mono">04 / DIGITAL FOOTPRINT</text><text x="647" y="506" font-size="32" fill="#e6ffed" font-weight="600">The-Trackher</text><g transform="translate(905 478)" fill="none" stroke="#39ff88" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"> <path d="M23 3v8 M3 23h8 M34 34l12 12 M38 23a15 15 0 1 0-30 0 15 15 0 0 0 30 0 M29 23a6 6 0 1 0-12 0 6 6 0 0 0 12 0"/></g><text x="647" y="540" font-size="16" fill="#a5b9ac" >OSINT for your own accounts.</text><text x="647" y="565" font-size="16" fill="#a5b9ac" >Breach exposure. Privacy checks.</text><text x="647" y="595" font-size="10" fill="#b7f34a" class="mono">PYTHON / PRIVACY &amp; OSINT</text><path d="M40 649H960" stroke="#1b3d27"/><text x="40" y="677" font-size="11" fill="#76b98c" class="mono">INSPECT</text><text x="426" y="677" font-size="11" fill="#76b98c" class="mono">EXPLAIN</text><text x="870" y="677" font-size="11" fill="#76b98c" class="mono">PRESERVE</text>
</svg>