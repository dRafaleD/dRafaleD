<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="455" viewBox="0 0 1000 455" role="img" aria-labelledby="title desc">
<title id="title">Engineering console</title><desc id="desc">Primary: Rust, YARA, YARA-X, C. Also using Assembly, C++, Python, JavaScript. PostgreSQL; Kali Linux, Debian, Arch Linux.</desc><defs>
<radialGradient id="nebula"><stop stop-color="#a3e635" stop-opacity=".24"/><stop offset=".42" stop-color="#14663d" stop-opacity=".16"/><stop offset="1" stop-color="#000000" stop-opacity="0"/></radialGradient>
<radialGradient id="core"><stop stop-color="#efffda" stop-opacity=".95"/><stop offset=".12" stop-color="#c6f5c5" stop-opacity=".7"/><stop offset=".42" stop-color="#a3e635" stop-opacity=".18"/><stop offset="1" stop-color="#a3e635" stop-opacity="0"/></radialGradient>
<radialGradient id="starGlow"><stop stop-color="#dfffea" stop-opacity=".85"/><stop offset=".12" stop-color="#a3e635" stop-opacity=".5"/><stop offset="1" stop-color="#a3e635" stop-opacity="0"/></radialGradient>
<linearGradient id="panel" x2="1" y2="1"><stop stop-color="#0a0a0a" stop-opacity=".94"/><stop offset="1" stop-color="#080808" stop-opacity=".82"/></linearGradient>
<linearGradient id="edge"><stop stop-color="#a3e635" stop-opacity=".55"/><stop offset=".55" stop-color="#a3e635" stop-opacity=".2"/><stop offset="1" stop-color="#a3e635" stop-opacity="0"/></linearGradient>
<linearGradient id="veil"><stop stop-color="#000000"/><stop offset=".48" stop-color="#000000" stop-opacity=".9"/><stop offset=".76" stop-color="#000000" stop-opacity="0"/></linearGradient>
<linearGradient id="meteor"><stop stop-color="#a3e635" stop-opacity="0"/><stop offset="1" stop-color="#e4ffec" stop-opacity=".9"/></linearGradient>
<radialGradient id="planet" cx="26%" cy="18%" r="86%"><stop stop-color="#5d8a6a"/><stop offset=".25" stop-color="#173d2b"/><stop offset=".63" stop-color="#071a11"/><stop offset="1" stop-color="#010503"/></radialGradient>
<radialGradient id="fogFade"><stop stop-color="white"/><stop offset=".5" stop-color="white" stop-opacity=".6"/><stop offset="1" stop-color="black"/></radialGradient>
<mask id="fogMask"><ellipse cx="760" cy="200" rx="480" ry="340" fill="url(#fogFade)"/></mask>
<filter id="spaceFog" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".008 .018" numOctaves="3" seed="17"/><feColorMatrix type="matrix" values="0 0 0 0 .06 0 0 0 0 .32 0 0 0 0 .17 0 0 0 .6 0"/></filter>
</defs><style>
.space-photo{animation:spaceDrift 8s ease-in-out infinite;transform-origin:75% 50%}@keyframes spaceDrift{0%,100%{transform:scale(1)}50%{transform:translate(-24px,-8px) scale(1.13)}}
.ui{font-family:'Segoe UI',Ubuntu,Arial,sans-serif}.mono{font-family:Consolas,'DejaVu Sans Mono',monospace;letter-spacing:.5px}
.star{animation:twinkle 5s ease-in-out infinite}.s1{animation-delay:-1.8s;animation-duration:7s}.s2{animation-delay:-3.7s;animation-duration:9s}
.galaxy-spin{animation:spin 95s linear infinite;transform-origin:0 0}
.breathe{animation:breathe 8s ease-in-out infinite}
.nebula-drift{animation:nebulaDrift 24s ease-in-out infinite}
.stream{stroke-dasharray:3 18;animation:stream 12s linear infinite}
.link-flow{stroke-dasharray:2 80;animation:stream 7s linear infinite}
.meteor{animation:meteor 13s linear infinite}.meteor.second{animation-delay:-7s;animation-duration:19s}
@keyframes twinkle{0%,100%{opacity:.16}50%{opacity:.8}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes nebulaDrift{0%,100%{transform:translate(0,0)}50%{transform:translate(-15px,7px)}}
@keyframes stream{to{stroke-dashoffset:-328}}
@keyframes meteor{0%,72%{opacity:0;transform:translate(-100px,-30px)}74%{opacity:.8}85%,100%{opacity:0;transform:translate(1150px,240px)}}
@media(prefers-reduced-motion:reduce){.space-photo,.star,.galaxy-spin,.breathe,.nebula-drift,.stream,.link-flow,.meteor{animation:none}.meteor{opacity:0}}
</style>
<rect width="1000" height="455" rx="12" fill="#000000"/><rect x=".5" y=".5" width="999" height="454" rx="8" fill="#0e0f12" stroke="#272a30"/><path class="stream" d="M24 48H976" stroke="#a3e635" stroke-width=".6" opacity=".18"/><text x="34" y="33" font-size="11" fill="#a3e635" class="mono" >dRafaleD@workspace:~ / 02</text><text x="34" y="73" font-size="30" fill="#e4e6ea" class="ui" >Engineering console</text><text x="34" y="101" font-size="15" fill="#adb2ba" class="ui" >Systems languages, detection engines and the platforms behind my work.</text><path d="M34 119H966" stroke="url(#edge)" stroke-width=".8"/><rect x="34" y="145" width="221" height="99" rx="6" fill="#15171b" stroke="#3a3e46" stroke-opacity=".6" stroke-width=".8"/><path d="M46 145.5H243" stroke="url(#edge)" stroke-width=".8"/><text x="52" y="172" font-size="10" fill="#adb2ba" class="mono" >SYSTEMS</text><text x="52" y="212" font-size="26" fill="#a3e635" class="mono" >Rust</text><circle class="breathe" cx="233" cy="168" r="2.5" fill="#a3e635"/><rect x="271" y="145" width="221" height="99" rx="6" fill="#15171b" stroke="#3a3e46" stroke-opacity=".6" stroke-width=".8"/><path d="M283 145.5H480" stroke="url(#edge)" stroke-width=".8"/><text x="289" y="172" font-size="10" fill="#adb2ba" class="mono" >DETECTION RULES</text><text x="289" y="212" font-size="26" fill="#a3e635" class="mono" >YARA</text><circle class="breathe" cx="470" cy="168" r="2.5" fill="#a3e635"/><rect x="508" y="145" width="221" height="99" rx="6" fill="#15171b" stroke="#3a3e46" stroke-opacity=".6" stroke-width=".8"/><path d="M520 145.5H717" stroke="url(#edge)" stroke-width=".8"/><text x="526" y="172" font-size="10" fill="#adb2ba" class="mono" >RULE ENGINE</text><text x="526" y="212" font-size="26" fill="#a3e635" class="mono" >YARA-X</text><circle class="breathe" cx="707" cy="168" r="2.5" fill="#a3e635"/><rect x="745" y="145" width="221" height="99" rx="6" fill="#15171b" stroke="#3a3e46" stroke-opacity=".6" stroke-width=".8"/><path d="M757 145.5H954" stroke="url(#edge)" stroke-width=".8"/><text x="763" y="172" font-size="10" fill="#adb2ba" class="mono" >LOW-LEVEL</text><text x="763" y="212" font-size="26" fill="#a3e635" class="mono" >C</text><circle class="breathe" cx="944" cy="168" r="2.5" fill="#a3e635"/><rect x="34" y="266" width="932" height="165" rx="6" fill="#15171b" stroke="#3a3e46" stroke-opacity=".6" stroke-width=".8"/><path d="M46 266.5H954" stroke="url(#edge)" stroke-width=".8"/><text x="54" y="305" font-size="11" fill="#adb2ba" class="mono" >ALSO USING</text><rect x="185.0" y="284" width="98.8" height="32" rx="7" fill="#111315" stroke="#303436" stroke-width=".8"/><path d="M193.0 285h82.8" stroke="#535957" opacity=".35"/><text x="202" y="305" font-size="13" fill="#c7ceca" class="mono" >Assembly</text><rect x="291.8" y="284" width="58.3" height="32" rx="7" fill="#111315" stroke="#303436" stroke-width=".8"/><path d="M299.8 285h42.3" stroke="#535957" opacity=".35"/><text x="308.8" y="305" font-size="13" fill="#c7ceca" class="mono" >C++</text><rect x="358.1" y="284" width="82.6" height="32" rx="7" fill="#111315" stroke="#303436" stroke-width=".8"/><path d="M366.1 285h66.6" stroke="#535957" opacity=".35"/><text x="375.1" y="305" font-size="13" fill="#c7ceca" class="mono" >Python</text><rect x="448.7" y="284" width="115.0" height="32" rx="7" fill="#111315" stroke="#303436" stroke-width=".8"/><path d="M456.7 285h99.0" stroke="#535957" opacity=".35"/><text x="465.7" y="305" font-size="13" fill="#c7ceca" class="mono" >JavaScript</text><text x="54" y="351" font-size="11" fill="#adb2ba" class="mono" >DATABASE</text><rect x="185.0" y="330" width="115.0" height="32" rx="7" fill="#111315" stroke="#303436" stroke-width=".8"/><path d="M193.0 331h99.0" stroke="#535957" opacity=".35"/><text x="202" y="351" font-size="13" fill="#c7ceca" class="mono" >PostgreSQL</text><text x="54" y="397" font-size="11" fill="#adb2ba" class="mono" >PLATFORMS</text><rect x="185.0" y="376" width="115.0" height="32" rx="7" fill="#111315" stroke="#303436" stroke-width=".8"/><path d="M193.0 377h99.0" stroke="#535957" opacity=".35"/><text x="202" y="397" font-size="13" fill="#c7ceca" class="mono" >Kali Linux</text><rect x="308.0" y="376" width="82.6" height="32" rx="7" fill="#111315" stroke="#303436" stroke-width=".8"/><path d="M316.0 377h66.6" stroke="#535957" opacity=".35"/><text x="325.0" y="397" font-size="13" fill="#c7ceca" class="mono" >Debian</text><rect x="398.6" y="376" width="115.0" height="32" rx="7" fill="#111315" stroke="#303436" stroke-width=".8"/><path d="M406.6 377h99.0" stroke="#535957" opacity=".35"/><text x="415.6" y="397" font-size="13" fill="#c7ceca" class="mono" >Arch Linux</text></svg>