="#263522" stroke-opacity=".85" stroke-width=".9"/><path d="M48 358.5H470" stroke="url(#edge)" stroke-width=".9"/><text x="56" y="387" font-size="10" fill="#a8cf98" class="mono" >03 / PYTHON · EMAIL SECURITY</text><text x="56" y="429" font-size="27" fill="#edf1e9" class="ui" >FhniX</text><text x="56" y="464" font-size="15.5" fill="#edf1e9" class="ui" >Explainable phishing email triage</text><text x="56" y="494" font-size="13.5" fill="#adb2ba" class="ui" >Desktop GUI, folder reports, IMAP scans &amp; local ML.</text><path class="stream" d="M56 518h195" stroke="#a8cf98" opacity=".4"/><rect x="516" y="358" width="450" height="184" rx="6" fill="#0a0e09" stroke="#263522" stroke-opacity=".85" stroke-width=".9"/><path d="M530 358.5H952" stroke="url(#edge)" stroke-width=".9"/><text x="538" y="387" font-size="10" fill="#82ed30" class="mono" >04 / PYTHON · OSINT / PRIVACY</text><text x="538" y="429" font-size="27" fill="#edf1e9" class="ui" >The-Trackher</text><text x="538" y="464" font-size="15.5" fill="#edf1e9" class="ui" >Digital footprint &amp; own-account OSINT</text><text x="538" y="494" font-size="13.5" fill="#adb2ba" class="ui" >Inspect exposed data and reduce privacy surface.</text><path class="stream" d="M538 518h195" stroke="#a8cf98" opacity=".4"/><rect x="34" y="572" width="450" height="184" rx="6" fill="#0a0e09" stroke="#263522" stroke-opacity=".85" stroke-width=".9"/><path d="M48 572.5H470" stroke="url(#edge)" stroke-width=".9"/><text x="56" y="601" font-size="10" fill="#a8cf98" class="mono" >05 / RUST · LINUX FORENSICS</text><text x="56" y="643" font-size="27" fill="#edf1e9" class="ui" >sentinel-security</text><text x="56" y="678" font-size="15.5" fill="#edf1e9" class="ui" >Linux MACB timeline forensic scanner</text><text x="56" y="708" font-size="13.5" fill="#adb2ba" class="ui" >Live filesystem &amp; TSK disk image artifact timelines.</text><path class="stream" d="M56 732h195" stroke="#a8cf98" opacity=".4"/><rect x="516" y="572" width="450" height="184" rx="6" fill="#0a0e09" stroke="#263522" stroke-opacity=".85" stroke-width=".9"/><path d="M530 572.5H952" stroke="url(#edge)" stroke-width=".9"/><text x="538" y="601" font-size="10" fill="#82ed30" class="mono" >06 / PYTHON · NETWORK TRIAGE</text><text x="538" y="643" font-size="27" fill="#edf1e9" class="ui" >flowscope</text><text x="538" y="678" font-size="15.5" fill="#edf1e9" class="ui" >Offline PCAP / PCAPNG traffic analyzer</text><text x="538" y="708" font-size="13.5" fill="#adb2ba" class="ui" >DNS, HTTP, TLS fingerprints, scan &amp; beacon heuristics.</text><path class="stream" d="M538 732h195" stroke="#a8cf98" opacity=".4"/><text x="34" y="804" font-size="10.5" fill="#adb2ba" class="mono" >&gt; OPEN-SOURCE SECURITY TOOLS</text><text x="966" y="804" font-size="10" fill="#a8cf98" class="mono" text-anchor="end">STATUS: MAINTAINED</text><rect x=".5" y=".5" width="999" height="834" rx="12" fill="none" stroke="#2b2e31" stroke-width="1"/></svg>