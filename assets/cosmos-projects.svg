<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="835" viewBox="0 0 1000 835" role="img" aria-labelledby="title desc"><title id="title">Selected projects</title><desc id="desc">Banshee: Offline security analysis &amp; evidence bundles; AsphDex: Static PE / ELF malware triage; FhniX: Explainable phishing email triage; The-Trackher: Digital footprint &amp; own-account OSINT; sentinel-security: Linux MACB timeline forensic scanner; flowscope: Offline PCAP / PCAPNG traffic analyzer</desc><defs>
