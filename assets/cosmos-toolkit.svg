<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="767" viewBox="0 0 1000 767" role="img" aria-labelledby="title desc">
<title id="title">Security toolkit</title><desc id="desc">Recon &amp; OSINT: Nmap,Shodan,theHarvester,Maltego,Tor,Amass,Recon-ng,SpiderFoot,Sherlock; Web security: Burp Suite,OWASP ZAP,Nikto,sqlmap,Gobuster,ffuf,WPScan,Nuclei,dirsearch; Offensive security: Metasploit,Hashcat,Hydra,John the Ripper,Aircrack-ng,Impacket,NetExec,Responder,BloodHound,Mimikatz,Evil-WinRM; Defensive analysis: Wireshark,Snort,VirusTotal,Splunk,YARA,tcpdump,Zeek,Suricata,Sysmon,Velociraptor,Volatility,ELK and Elastic,Sigma; Reverse engineering: Ghidra,IDA,radare2,Cutter,x64dbg,GDB,Binary Ninja,dnSpy,Frida,objdump,PE-bear,Detect It Easy,HxD,WinDbg,Procmon</desc>
<style>
.ui{font-family:'Segoe UI',Ubuntu,Arial,sans-serif}.mono{font-family:Consolas,'DejaVu Sans Mono',monospace}
.twinkle{animation:twinkle 7s ease-in-out infinite}
.orbit{animation:orbit 28s linear infinite;transform-origin:0px 0px}
.signal{stroke-dasharray:3 170;animation:signal 22s linear infinite}
.drift{animation:drift 18s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.12}50%{opacity:.52}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes signal{to{stroke-dashoffset:-346}}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media(prefers-reduced-motion:reduce){.twinkle,.orbit,.signal,.drift{animation:none}}
</style>
