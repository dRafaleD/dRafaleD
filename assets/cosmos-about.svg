<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="363" viewBox="0 0 1000 363" role="img" aria-labelledby="title desc">
<title id="title">About Eren Erdoğan</title><desc id="desc">I study backend development and explore cybersecurity, Linux systems, and secure software development. My projects trace different signals: binaries, email, digital footprints, and the evidence they leave behind. I am learning penetration testing, OSINT, malware analysis, reverse engineering, and full-stack development through practical work.</desc><defs>
