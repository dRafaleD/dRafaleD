<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="368" viewBox="0 0 1000 368" role="img" aria-labelledby="title desc"><title id="title">About Eren Erdoğan</title><desc id="desc">I study backend development and explore cybersecurity, Linux internals, and secure software engineering. My tools focus on verifiable, offline-first investigation across binaries, emails, timelines, and traffic. Through practical builds and security labs, I work across malware triage, digital forensics, OSINT, penetration testing, and backend architecture.</desc><defs>
