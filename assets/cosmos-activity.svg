<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="196" viewBox="0 0 1000 196" role="img" aria-labelledby="title desc"><title id="title">GitHub activity</title><desc id="desc">GitHub activity, contribution streaks, and contribution graph.</desc><defs>
<radialGradient id="nebula"><stop stop-color="#9fc4e8" stop-opacity=".22"/><stop offset=".45" stop-color="#4a7fa8" stop-opacity=".14"/><stop offset="1" stop-color="#0e0f12" stop-opacity="0"/></radialGradient>
<radialGradient id="nebulaLime"><stop stop-color="#98ecae" stop-opacity=".16"/><stop offset=".48" stop-color="#333d4c" stop-opacity=".12"/><stop offset="1" stop-color="#0e0f12" stop-opacity="0"/></radialGradient>
<radialGradient id="core"><stop stop-color="#efffda" stop-opacity=".95"/><stop offset=".15" stop-color="#c6f5c5" stop-opacity=".7"/><stop offset=".45" stop-color="#9fc4e8" stop-opacity=".18"/><stop offset="1" stop-color="#9fc4e8" stop-opacity="0"/></radialGradient>
<radialGradient id="starGlow"><stop stop-color="#dfffea" stop-opacity=".85"/><stop offset=".18" stop-color="#9fc4e8" stop-opacity=".45"/><stop offset="1" stop-color="#9fc4e8" stop-opacity="0"/></radialGradient>
<linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e0f12"/><stop offset=".6" stop-color="#15171b"/><stop offset="1" stop-color="#0e0f12"/></linearGradient>
<linearGradient id="panel" x2="1" y2="1"><stop stop-color="#1b1e23" stop-opacity=".92"/><stop offset="1" stop-color="#15171b" stop-opacity=".84"/></linearGradient>
<linearGradient id="edge"><stop stop-color="#9fc4e8" stop-opacity=".6"/><stop offset=".55" stop-color="#98ecae" stop-opacity=".28"/><stop offset="1" stop-color="#9fc4e8" stop-opacity="0"/></linearGradient>
<linearGradient id="veil"><stop stop-color="#0e0f12"/><stop offset=".46" stop-color="#0e0f12" stop-opacity=".88"/><stop offset=".78" stop-color="#0e0f12" stop-opacity=".24"/><stop offset="1" stop-color="#0e0f12" stop-opacity=".08"/></linearGradient>
<linearGradient id="veilStrong"><stop stop-color="#0e0f12" stop-opacity=".95"/><stop offset=".55" stop-color="#0e0f12" stop-opacity=".82"/><stop offset="1" stop-color="#0e0f12" stop-opacity=".5"/></linearGradient>
<linearGradient id="meteor"><stop stop-color="#9fc4e8" stop-opacity="0"/><stop offset="1" stop-color="#e4ffec" stop-opacity=".92"/></linearGradient>
<radialGradient id="planet" cx="26%" cy="18%" r="86%"><stop stop-color="#5d8a6a"/><stop offset=".26" stop-color="#173d2b"/><stop offset=".64" stop-color="#071a11"/><stop offset="1" stop-color="#010503"/></radialGradient>
</defs><style>
.space-photo{animation:spaceDrift 22s ease-in-out infinite;transform-origin:75% 50%}
@keyframes spaceDrift{0%,100%{transform:scale(1)}50%{transform:translate(-8px,-3px) scale(1.045)}}
.ui{font-family:'Segoe UI',Ubuntu,Arial,sans-serif}
.mono{font-family:Consolas,'DejaVu Sans Mono',monospace;letter-spacing:.4px}
.star{animation:twinkle 5.5s ease-in-out infinite}
.s1{animation-delay:-1.9s;animation-duration:7.2s}
.s2{animation-delay:-3.8s;animation-duration:9.4s}
.galaxy-spin{animation:spin 100s linear infinite;transform-origin:0 0}
.breathe{animation:breathe 8s ease-in-out infinite}
.nebula-drift{animation:nebulaDrift 26s ease-in-out infinite}
.stream{stroke-dasharray:3 16;animation:stream 14s linear infinite}
.link-flow{stroke-dasharray:2 84;animation:stream 7.5s linear infinite}
.cursor{animation:blink 1.15s steps(2,start) infinite}
.scan{animation:scan 9s linear infinite;opacity:.75}
.meteor{animation:meteor 14s linear infinite}
.meteor.second{animation-delay:-7.5s;animation-duration:21s}
@keyframes twinkle{0%,100%{opacity:.16}50%{opacity:.86}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{opacity:.52}50%{opacity:1}}
@keyframes nebulaDrift{0%,100%{transform:translate(0,0)}50%{transform:translate(-14px,6px)}}
@keyframes stream{to{stroke-dashoffset:-328}}
@keyframes blink{0%,49%{opacity:.95}50%,100%{opacity:0}}
@keyframes scan{0%{transform:translateX(0);opacity:0}10%{opacity:.85}90%{opacity:.85}100%{transform:translateX(var(--end,360px));opacity:0}}
@keyframes meteor{0%,72%{opacity:0;transform:translate(-100px,-30px)}74%{opacity:.85}86%,100%{opacity:0;transform:translate(1160px,240px)}}
@media(prefers-reduced-motion:reduce){.space-photo,.star,.galaxy-spin,.breathe,.nebula-drift,.stream,.link-flow,.cursor,.scan,.meteor{animation:none}.meteor{opacity:0}}
</style><rect width="1000" height="196" rx="12" fill="#0e0f12"/><rect width="1000" height="196" fill="url(#veil)"/><circle cx="38" cy="26" r="3.6" fill="#545963"/><circle cx="52" cy="26" r="3.6" fill="#3a3e46"/><circle cx="66" cy="26" r="3.6" fill="#9fc4e8" opacity=".65"/><text x="82" y="30" font-size="11.5" fill="#9fc4e8" class="mono" >dRafaleD@github:~$ git log --stat</text><text x="966" y="30" font-size="10" fill="#a3a9b3" class="mono" text-anchor="end">ACTIVITY</text><text x="34" y="72" font-size="28" fill="#e4e6ea" class="mono" >GitHub activity.</text><text x="34" y="100" font-size="14.5" fill="#adb2ba" class="ui" >Contribution streaks and recent commit activity.</text><path d="M34 118H966" stroke="url(#edge)" stroke-width=".9"/><text x="36" y="165" font-size="13" fill="#9fc4e8" class="mono" >TRACE VIEW</text><rect x="572" y="137" width="113" height="38" rx="6" fill="#15171b" stroke="#3a3e46" stroke-opacity=".85" stroke-width=".9"/><path d="M586 137.5H671" stroke="url(#edge)" stroke-width=".9"/><text x="588" y="162" font-size="16" fill="#e4e6ea" class="mono" >entry</text><path d="M685 156h20m-5 -4 5 4 -5 4" fill="none" stroke="#9fc4e8"/><rect x="706" y="137" width="113" height="38" rx="6" fill="#15171b" stroke="#3a3e46" stroke-opacity=".85" stroke-width=".9"/><path d="M720 137.5H805" stroke="url(#edge)" stroke-width=".9"/><text x="722" y="162" font-size="16" fill="#98ecae" class="mono" >decode</text><path d="M819 156h20m-5 -4 5 4 -5 4" fill="none" stroke="#9fc4e8"/><rect x="840" y="137" width="113" height="38" rx="6" fill="#15171b" stroke="#3a3e46" stroke-opacity=".85" stroke-width=".9"/><path d="M854 137.5H939" stroke="url(#edge)" stroke-width=".9"/><text x="856" y="162" font-size="16" fill="#e4e6ea" class="mono" >return</text><rect x=".5" y=".5" width="999" height="195" rx="12" fill="none" stroke="#2b2e31" stroke-width="1"/></svg>