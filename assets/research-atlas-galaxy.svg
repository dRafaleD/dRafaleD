<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="704" viewBox="0 0 1000 704" role="img" aria-labelledby="t d">
<title id="t">Research atlas — neon galaxy</title><desc id="d">Four local security projects connected by flowing signals around a neon-green evidence core. Banshee, AsphDex, FhniX and The-Trackher.</desc>
<defs>
 <radialGradient id="halo"><stop stop-color="#39ff88" stop-opacity=".12"/><stop offset="1" stop-color="#39ff88" stop-opacity="0"/></radialGradient>
 <linearGradient id="fade"><stop stop-color="#39ff88" stop-opacity=".55"/><stop offset="1" stop-color="#39ff88" stop-opacity="0"/></linearGradient>
 <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<style>
text{font-family:'Segoe UI',Ubuntu,Arial,sans-serif}
.mono{font-family:Consolas,'DejaVu Sans Mono',monospace;letter-spacing:1.8px}
.flow{stroke-dasharray:3 22;animation:flow 9s linear infinite}
.orbit{animation:orbit 60s linear infinite;transform-origin:500px 370px}
.pulse{animation:pulse 5s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-250}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.flow,.orbit,.pulse{animation:none}}
</style>
<rect width="1000" height="704" rx="16" fill="#000"/>
<text x="40" y="45" font-size="13" fill="#39ff88" class="mono">THE RESEARCH ATLAS</text><text x="40" y="99" font-size="43" fill="#d7ffe3" font-weight="600">From signal to evidence.</text><text x="40" y="132" font-size="18" fill="#d7ffe3" >Four projects. One way of thinking: inspect, explain, preserve.</text><text x="960" y="45" font-size="10" fill="#86b697" class="mono" text-anchor="end">OPEN SOURCE / LOCAL FIRST</text><defs><radialGradient id="nebula"><stop stop-color="#39ff88" stop-opacity=".19"/><stop offset=".4" stop-color="#0b713e" stop-opacity=".11"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient></defs><ellipse cx="500" cy="370" rx="360" ry="270" fill="url(#nebula)"/><circle class="pulse" style="animation-delay:-0s" cx="545.7" cy="217.9" r="1.2" fill="#d7ffe3" opacity="0.28"/><circle class="pulse" style="animation-delay:-0s" cx="232.1" cy="399.0" r="1.4" fill="#d7ffe3" opacity="0.22"/><circle class="pulse" style="animation-delay:-2s" cx="85.3" cy="393.0" r="0.7" fill="#d7ffe3" opacity="0.21"/><circle class="pulse" style="animation-delay:-2s" cx="567.6" cy="289.9" r="0.6" fill="#d7ffe3" opacity="0.41"/><circle class="pulse" style="animation-delay:-2s" cx="497.1" cy="210.5" r="0.6" fill="#d7ffe3" opacity="0.22"/><circle class="pulse" style="animation-delay:-3s" cx="338.5" cy="410.2" r="0.8" fill="#d7ffe3" opacity="0.33"/><circle class="pulse" style="animation-delay:-0s" cx="426.2" cy="577.8" r="0.5" fill="#d7ffe3" opacity="0.39"/><circle class="pulse" style="animation-delay:-2s" cx="431.4" cy="278.4" r="1.3" fill="#d7ffe3" opacity="0.24"/><circle class="pulse" style="animation-delay:-3s" cx="561.1" cy="496.3" r="1.3" fill="#d7ffe3" opacity="0.52"/><circle class="pulse" style="animation-delay:-1s" cx="576.8" cy="504.7" r="0.9" fill="#d7ffe3" opacity="0.37"/><circle class="pulse" style="animation-delay:-3s" cx="433.1" cy="467.7" r="1.4" fill="#d7ffe3" opacity="0.51"/><circle class="pulse" style="animation-delay:-4s" cx="528.0" cy="174.7" r=