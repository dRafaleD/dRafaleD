"1.5"/><circle cx="575" cy="550" r="1.5"/><circle cx="403" cy="405" r="1.5"/><circle cx="603" cy="414" r="1.5"/></g><path d="M370 251C440 251 405 370 500 370" fill="none" stroke="#1c422b" stroke-width="1.5"/><path class="flow" style="animation-delay:-0s" d="M370 251C440 251 405 370 500 370" fill="none" stroke="#39ff88" stroke-width="2"/><path d="M630 251C560 251 595 370 500 370" fill="none" stroke="#1c422b" stroke-width="1.5"/><path class="flow" style="animation-delay:-2s" d="M630 251C560 251 595 370 500 370" fill="none" stroke="#39ff88" stroke-width="2"/><path d="M370 509C440 509 405 370 500 370" fill="none" stroke="#1c422b" stroke-width="1.5"/><path class="flow" style="animation-delay:-4s" d="M370 509C440 509 405 370 500 370" fill="none" stroke="#39ff88" stroke-width="2"/><path d="M630 509C560 509 595 370 500 370" fill="none" stroke="#1c422b" stroke-width="1.5"/><path class="flow" style="animation-delay:-6s" d="M630 509C560 509 595 370 500 370" fill="none" stroke="#39ff88" stroke-width="2"/><circle cx="500" cy="370" r="104" fill="none" stroke="#173c25"/><g class="orbit"><circle cx="500" cy="370" r="91" fill="none" stroke="#39ff88" stroke-opacity=".5" stroke-dasharray="38 175 8 175"/><circle cx="500" cy="279" r="4" fill="#39ff88"/></g><circle cx="500" cy="370" r="115" fill="none" stroke="#28673b" stroke-opacity=".45" stroke-dasharray="1 13"/><g class="orbit" style="animation-duration:80s"><ellipse cx="500" cy="370" rx="139" ry="50" transform="rotate(-28 500 370)" fill="none" stroke="#39ff88" stroke-opacity=".2"/><ellipse cx="500" cy="370" rx="139" ry="50" transform="rotate(28 500 370)" fill="none" stroke="#d7ffe3" stroke-opacity=".12"/></g><path class="pulse" d="m500 312 58 58-58 58-58-58Z" fill="none" stroke="#39ff88" stroke-width="2.5" filter="url(#glow)"/><path d="m500 312 58 58-58 58-58-58Z" fill="#0b1b10" stroke="#39ff88" stroke-opacity=".8"/><path d="m500 325 45 45-45 45-45-45Z" fill="none" stroke="#1b512c"/><text x="500" y="368" font-size="15" fill="#d7ffe3" text-anchor="middle" class="mono">EVIDENCE</text><text x="500" y="390" font-size="10" fill="#86b697" text-anchor="middle" class="mono">LOCAL FIRST</text><path d="M41 230v32" stroke="#39ff88" stroke-width="2" stroke-linecap="round"/><text x="57" y="205" font-size="11" fill="#86b697" class="mono">01 / OFFLINE ANALYSIS</text><text x="57" y="248" font-size="32" fill="#39ff88" font-weight="600">Banshee</text><g transform="translate(315 220)" fill="none" stroke="#39ff88" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"> <path d="M7 3h19l9 9v31H7Z M26 3v10h9 M14 23h14 M14 30h14"/></g><text x="57" y="282" font-size="14" fill="#d7ffe3" >Decode values. Inspect files.</text><text x="57" y="307" font-size="14" fill="#d7ffe3" >Extract IOCs. Preserve evidence.</text><text x="57" y="337" font-size="10" fill="#39ff88" class="mono">RUST / YARA / ALPHA</text><path d="M631 230v32" stroke="#39ff88" stroke-width="2" stroke-linecap="round"/><text x="647" y="205" font-size="11" fill="#86b697" class="mono">02 / STATIC MALWARE TRIAGE</text><text x="647" y="248" font-size="32" fill="#39ff88" font-weight="600">AsphDex</text><g transform="translate(905 220)" fill="none" stroke="#39ff88" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"> <path d="m22 2 17 7v13c0 12-17 23-17 23S5 34 5 22V9Z M13 23l7 7 12-16"/></g><text x="647" y="282" font-size="14" fill="#d7ffe3" >PE/ELF inspection. YARA matches.</text><text x="647" y="307" font-size="14" fill="#d7ffe3" >Explain findings. No execution.</text><text x="647" y="337" font-size="10" fill="#39ff88" class="mono">ELECTRON / JS / RUST / YARA</text><path d="M41 488v32" stroke="#39ff88" stroke-width="2" stroke-linecap="round"/><text x="57" y="463" font-size="11" fill="#86b697" class="mono">03 / EMAIL SECURITY</text><text x="57" y="506" font-size="32" fill="#39ff88" font-weight="600">FhniX</text><g transform="translate(315 478)" fill="none" stroke="#39ff88" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"> <path d="M3 10h39v29H3Z m1 2 19 14 18-14 M4 38l13-14 M41 38 28 24"/></g><text x="57" y="540" font-size="14" fill="#d7ffe3" >Explainable phishing triage.</text><text x="57" y="565" font-size="14" fill="#d7ffe3" >Local scoring. Read-only IMAP.</text><text x="57" y="595" font-size="10" fill="#39ff88" class="mono">PYTHON / DESKTOP &amp; CLI</text><path d="M631 488v32" stroke="#39ff88" stroke-width="2" stroke-linecap="round"/><text x="647" y="463" font-size="11" fill="#86b697" class="mono">04 / DIGITAL FOOTPRINT</text><text x="647" y="506" font-size="32" fill="#39ff88" font-weight="600">The-Trackher</text><g transform="translate(905 478)" fill="none" stroke="#39ff88" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"> <path d="M23 3v8 M3 23h8 M34 34l12 12 M38 23a15 15 0 1 0-30 0 15 15 0 0 0 30 0 M29 23a6 6 0 1 0-12 0 6 6 0 0 0 12 0"/></g><text x="647" y="540" font-size="14" fill="#d7ffe3" >OSINT for your own accounts.</text><text x="647" y="565" font-size="14" fill="#d7ffe3" >Breach exposure. Privacy checks.</text><text x="647" y="595" font-size="10" fill="#39ff88" class="mono">PYTHON / PRIVACY &amp; OSINT</text><path d="M40 649H960" stroke="#1b3d27"/><text x="40" y="677" font-size="11" fill="#86b697" class="mono">INSPECT</text><text x="426" y="677" font-size="11" fill="#86b697" class="mono">EXPLAIN</text><text x="870" y="677" font-size="11" fill="#86b697" class="mono">PRESERVE</text><style>text{font-family:'Cascadia Mono','Cascadia Code',Consolas,Menlo,'DejaVu Sans Mono',monospace}</style>
