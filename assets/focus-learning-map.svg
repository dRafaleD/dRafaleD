<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="494" viewBox="0 0 1000 494" role="img" aria-labelledby="t d">
<title id="t">Security focus and current learning</title><desc id="d">Research: web security, vulnerability assessment, code review, OSINT, malware analysis, reverse engineering, cryptography, Linux and networking. Learning: advanced web security, malware analysis, Linux hardening and secure backend architecture.</desc>
<defs>
 <radialGradient id="halo"><stop stop-color="#39ff88" stop-opacity=".12"/><stop offset="1" stop-color="#39ff88" stop-opacity="0"/></radialGradient>
 <linearGradient id="fade"><stop stop-color="#39ff88" stop-opacity=".55"/><stop offset="1" stop-color="#39ff88" stop-opacity="0"/></linearGradient>
 <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<style>
text{font-family:'Segoe UI',Ubuntu,Arial,sans-serif}
.mono{font-family:Consolas,'DejaVu Sans Mono',monospace;letter-spacing:1.8px}
.flow{stroke-dasharray:3 22;animation:flow 9s linear infinite}
.orbit{animation:orbit 60s linear infinite;transform-origin:500px 370px}
.pulse{animation:pulse 5s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-250}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.flow,.orbit,.pulse{animation:none}}
</style>
<rect width="1000" height="494" rx="20" fill="#070b09"/>
<text x="40" y="43" font-size="13" fill="#39ff88" class="mono">RESEARCH / NEXT HORIZON</text><text x="40" y="88" font-size="34" fill="#e6ffed" font-weight="600">Curiosity, with a direction.</text><path d="M500 142V420" stroke="#20412c"/><path class="flow" d="M500 142V420" stroke="#39ff88" fill="none" stroke-width="2"/><text x="40" y="157" font-size="12" fill="#b7f34a" class="mono">INVESTIGATING</text><text x="555" y="157" font-size="12" fill="#b7f34a" class="mono">GOING DEEPER</text><text x="40" y="201" font-size="19" fill="#a5b9ac" >Web security &amp; penetration testing</text><text x="40" y="236" font-size="19" fill="#a5b9ac" >Vulnerability assessment &amp; code review</text><text x="40" y="271" font-size="19" fill="#a5b9ac" >OSINT &amp; digital footprints</text><text x="40" y="306" font-size="19" fill="#a5b9ac" >Malware analysis &amp; reverse engineering</text><text x="40" y="341" font-size="19" fill="#a5b9ac" >Cryptography &amp; applied security</text><text x="40" y="376" font-size="19" fill="#a5b9ac" >Linux, networking &amp; automation</text><circle cx="561" cy="195" r="4" fill="#070b09" stroke="#39ff88"/><text x="580" y="201" font-size="18" fill="#a5b9ac" >Advanced web application security</text><circle cx="561" cy="247" r="4" fill="#070b09" stroke="#39ff88"/><text x="580" y="253" font-size="18" fill="#a5b9ac" >Malware analysis &amp; reverse engineering</text><circle cx="561" cy="299" r="4" fill="#070b09" stroke="#39ff88"/><text x="580" y="305" font-size="18" fill="#a5b9ac" >Linux hardening &amp; network security</text><circle cx="561" cy="351" r="4" fill="#070b09" stroke="#39ff88"/><text x="580" y="357" font-size="18" fill="#a5b9ac" >Secure API &amp; backend architecture</text><path d="M40 432H960" stroke="#193723"/><path d="M40 432H240" stroke="#39ff88" stroke-opacity=".4"/><text x="40" y="466" font-size="11" fill="#7fa38a" class="mono">LEARN BY BUILDING. UNDERSTAND BY INVESTIGATING.</text>
</svg>