name: Update profile terminal

on:
  schedule:
    # Runs daily at 06:17 Europe/Istanbul (03:17 UTC).
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-terminal:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install image renderer dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Render terminal with current GitHub stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/render_profile_terminal.py

      - name: Render streak card from GitHub contributions
        env:
          # Uses a personal token when configured so anonymous private
          # contributions are included; otherwise falls back to github.token.
          GITHUB_TOKEN: ${{ secrets.CONTRIBUTIONS_TOKEN || github.token }}
        run: python scripts/render_streak_card.py

      - name: Commit updated profile activity when it changed
        shell: bash
        run: |
          if git diff --quiet -- assets/profile-terminal-v2.gif assets/github-streak.svg; then
            echo "Profile activity assets are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-terminal-v2.gif assets/github-streak.svg
          git commit -m "chore: refresh profile activity stats"
          git push
