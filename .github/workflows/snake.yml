name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: dRafaleD
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#39FF88&color_dots=#EBEDF0,#C6F6D5,#68D391,#2F855A,#123D25
            dist/github-contribution-grid-snake-dark.svg?color_snake=#39FF88&color_dots=#070B09,#0B1B10,#123D25,#1F7A3F,#39FF88

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
