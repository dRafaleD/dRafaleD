name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out profile framing scripts
        uses: actions/checkout@v4

      - uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: dRafaleD
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#98ECAE&color_dots=#232830,#334459,#4B6983,#7598B7,#B4CEE6
            dist/github-contribution-grid-snake-dark.svg?color_snake=#98ECAE&color_dots=#20252C,#324355,#4A657F,#7093B2,#A9C9E5

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Frame contribution animation in the profile universe
        run: python3 scripts/frame_contribution_snake.py dist --output framed-dist

      - uses: crazy-max/ghaction-github-pages@5859b4ea7efe6b470a5b19c570460eae9323aefc # v3
        with:
          target_branch: output
          build_dir: framed-dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
