name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: dRafaleD
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#9FC4E8&color_dots=#E7E9EC,#C5D8EB,#9FC4E8,#6C95BC,#2F5F8F
            dist/github-contribution-grid-snake-dark.svg?color_snake=#9FC4E8&color_dots=#15171B,#272F3A,#3F5C78,#6C95BC,#9FC4E8

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@5859b4ea7efe6b470a5b19c570460eae9323aefc # v3
        with:
          target_branch: output
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
