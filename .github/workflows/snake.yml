name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: dRafaleD
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#B7F34A&color_dots=#EBEDF0,#39FF88,#39FF88,#39FF88,#39FF88
            dist/github-contribution-grid-snake-dark.svg?color_snake=#B7F34A&color_dots=#070B09,#39FF88,#39FF88,#39FF88,#39FF88

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@5859b4ea7efe6b470a5b19c570460eae9323aefc # v3
        with:
          target_branch: output
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
